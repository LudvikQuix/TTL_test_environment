name: Dedup Filter
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic with raw events (may contain duplicate keys)
    defaultValue: raw-events
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic with deduplicated events
    defaultValue: deduped-events
    required: true
  - name: STATE_TTL_SECONDS
    inputType: FreeText
    description: Per-write ttl= for new dedup entries, in seconds.
    defaultValue: "30"
    required: false
  - name: LEGACY_RECORDS_TTL_SECONDS
    inputType: FreeText
    description: Backfill TTL (seconds) for pre-existing legacy records on upgrade. 0 = off (reject on populated store).
    defaultValue: "30"
    required: false
  - name: VALUE_PADDING_BYTES
    inputType: FreeText
    description: Pad each stored value with this many bytes so TTL timestamp overhead is small relative to entry size.
    defaultValue: "200"
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
