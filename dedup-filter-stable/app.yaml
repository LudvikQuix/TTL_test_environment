name: Dedup Filter Stable 3-23-6
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic with raw events (shared input across all dedup filters)
    defaultValue: raw-events
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic with deduplicated events (stable-baseline pipeline)
    defaultValue: deduped-events-stable
    required: true
  - name: VALUE_PADDING_BYTES
    inputType: FreeText
    description: Pad each stored value with this many bytes (matches the TTL filter for apples-to-apples comparison).
    defaultValue: "200"
    required: false
  - name: TTL_MODE
    inputType: FreeText
    description: "0 = legacy SEEDER (no ttl=, byte-identical to 3.23.6). 1 = TTL build (ttl= writes + legacy_records_ttl -> flip+backfill). Toggle here, no code push."
    defaultValue: "0"
    required: false
  - name: CG_VERSION
    inputType: FreeText
    description: Consumer-group suffix (e.g. v7.8). Bump for a fresh clean store without touching code.
    defaultValue: v7.8
    required: false
  - name: LEGACY_RECORDS_TTL_SECONDS
    inputType: FreeText
    description: Backfill expiry for pre-existing legacy records on flip. Set LONG (e.g. 600) when testing OP-4 so records survive the manual steps.
    defaultValue: "5"
    required: false
  - name: STATE_TTL_SECONDS
    inputType: FreeText
    description: Per-write ttl= for new dedup entries. Set LONG (e.g. 600) when testing OP-4 so records do not expire mid-test.
    defaultValue: "5"
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
