name: Duplicate Key Generator (No TTL)
language: python
variables:
  - name: output
    inputType: OutputTopic
    description: Topic to produce messages to (feeds the no-TTL dedup filter)
    defaultValue: raw-events-no-ttl
    required: true
  - name: KEY_SPACE
    inputType: FreeText
    description: Upper bound for random order IDs (1..KEY_SPACE). Larger = more unique keys = faster state growth downstream.
    defaultValue: "1000000"
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
