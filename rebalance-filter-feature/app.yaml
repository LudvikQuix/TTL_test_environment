name: Rebalance Filter Feature
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Write-heavy 8-partition input topic (state split across replicas).
    defaultValue: rebalance-raw-events
    required: true
  - name: output
    inputType: OutputTopic
    description: Output topic; its high-watermark is the stall/handover signal.
    defaultValue: rebalance-feature-out
    required: true
  - name: CG_PREFIX
    inputType: FreeText
    description: Consumer-group prefix (state namespace). Per deployment to isolate stores.
    defaultValue: rebalance-filter-feature
    required: false
  - name: CG_VERSION
    inputType: FreeText
    description: Consumer-group suffix (e.g. v1). Bump for a fresh clean store, no code change.
    defaultValue: v1
    required: false
  - name: VALUE_PADDING_BYTES
    inputType: FreeText
    description: Bytes of 'x' padding per stored value; grows state to hundreds of MB.
    defaultValue: "2000"
    required: false
  - name: MAX_POLL_INTERVAL_MS
    inputType: FreeText
    description: consumer_extra_config max.poll.interval.ms. Low (60000) so a slow revoke/close can exceed it and eviction is observable; also scales the feature build's bounded-flush (x0.2) and open-deadline (x0.5) budgets.
    defaultValue: "60000"
    required: false
  - name: ROCKSDB_WRITE_BUFFER_SIZE
    inputType: FreeText
    description: RocksDB write buffer size in bytes (memtable). Small = frequent flushes = compaction debt.
    defaultValue: "1048576"
    required: false
  - name: ROCKSDB_TARGET_FILE_SIZE_BASE
    inputType: FreeText
    description: RocksDB target SST file size in bytes. Small = many small SSTs = continuous compaction.
    defaultValue: "2097152"
    required: false
  - name: ROCKSDB_MAX_WRITE_BUFFER_NUMBER
    inputType: FreeText
    description: Max RocksDB write buffers (memtables) per store partition.
    defaultValue: "2"
    required: false
  - name: STATE_SIZE_LOG_INTERVAL
    inputType: FreeText
    description: Seconds between periodic [STATE-SIZE-REBAL] status lines (when LOGGER=on).
    defaultValue: "5"
    required: false
  - name: LOGGER
    inputType: FreeText
    description: on/off. off disables the periodic [STATE-SIZE-REBAL] status logger.
    defaultValue: "on"
    required: false
  - name: QS_LOGLEVEL
    inputType: FreeText
    description: quixstreams logger level. DEBUG (default) is REQUIRED to observe the fast-revoke and benign-close markers (both DEBUG-level) and the per-attempt open line used for max_lock_attempt. No per-message DEBUG in the hot path, so it does not flood.
    defaultValue: DEBUG
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
