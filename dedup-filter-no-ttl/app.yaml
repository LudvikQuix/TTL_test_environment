name: Dedup Filter No TTL
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic with raw events (shared input across all dedup filters)
    defaultValue: raw-events
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic with deduplicated events (no-TTL pipeline)
    defaultValue: deduped-events-no-ttl
    required: true
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
