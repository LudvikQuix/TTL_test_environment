name: TTL Verify Feature
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic produced by ttl-verify-generator
    defaultValue: ttl-verify-input
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic for messages that passed the TTL deduper
    defaultValue: ttl-verify-feature-out
    required: true
  - name: STATE_TTL_SECONDS
    inputType: FreeText
    description: Must be SHORTER than generator's WAIT_SECONDS so batch 2 sees expired state.
    defaultValue: "5"
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
