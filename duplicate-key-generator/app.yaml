name: Duplicate Key Generator
language: python
variables:
  - name: output
    inputType: OutputTopic
    description: Topic to produce duplicate-key messages to
    defaultValue: raw-events
    required: true
  - name: KEY_SPACE
    inputType: FreeText
    description: Upper bound for random order IDs (1..KEY_SPACE). Larger = more unique keys = faster state growth downstream.
    defaultValue: "1000000"
    required: false
  - name: MESSAGE_COUNT
    inputType: FreeText
    description: Total number of messages to produce, then exit. Makes the run deterministic in length.
    defaultValue: "600"
    required: false
  - name: SLEEP_SECONDS
    inputType: FreeText
    description: Delay between messages in seconds. Default 0.1 = ~10 msg/s.
    defaultValue: "0.1"
    required: false
  - name: SEED
    inputType: FreeText
    description: Optional integer seed for random. Set to make the sequence reproducible across runs.
    defaultValue: ""
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
