name: Dedup Filter Stable 3-23-6
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Topic with raw events (shared input across all dedup filters)
    defaultValue: raw-events
    required: true
  - name: output
    inputType: OutputTopic
    description: Topic with deduplicated events
    defaultValue: deduped-events-stable
    required: true
  - name: VALUE_PADDING_BYTES
    inputType: FreeText
    description: Pad each stored value with this many bytes (apples-to-apples across filters).
    defaultValue: "1"
    required: false
  - name: CG_PREFIX
    inputType: FreeText
    description: Consumer-group prefix (state namespace). Per service to isolate stores.
    defaultValue: dedup-filter-stable
    required: false
  - name: CG_VERSION
    inputType: FreeText
    description: Consumer-group suffix (e.g. v1). Bump for a fresh clean store, no code change.
    defaultValue: v8.3
    required: false
  - name: TTL_MODE
    inputType: FreeText
    description: "0 = legacy seeder (no ttl=, byte-identical to 3.23.6). 1 = TTL build (ttl= + legacy_records_ttl -> flip+backfill)."
    defaultValue: "0"
    required: false
  - name: STATE_TTL_SECONDS
    inputType: FreeText
    description: Per-write ttl= for new dedup entries, seconds (used when TTL_MODE=1).
    defaultValue: "30"
    required: false
  - name: LEGACY_RECORDS_TTL_SECONDS
    inputType: FreeText
    description: One-time backfill TTL (seconds) for pre-existing legacy records on upgrade (used when TTL_MODE=1).
    defaultValue: "30"
    required: false
  - name: LOGGER
    inputType: FreeText
    description: "on/off. off disables the periodic status logger (skips its per-interval rocksdb key scan). Set off in production."
    defaultValue: "on"
    required: false
  - name: TTL_CHANGELOG_TOMBSTONES
    inputType: FreeText
    description: "1 = TTL sweep also deletes expired keys from the changelog topic (compaction shrinks it). 0 = local-only sweep, changelog keeps every record."
    defaultValue: "1"
    required: false
  - name: QUIXSTREAMS_STATE_LOG_LEVEL
    inputType: FreeText
    description: Log level for the quixstreams state layer (DEBUG shows per-chunk backfill/migration progress).
    defaultValue: INFO
    required: false
  - name: STATE_SIZE_LOG_INTERVAL
    inputType: FreeText
    description: Seconds between periodic [STATE-SIZE-STABLE] status lines (when LOGGER=on).
    defaultValue: "10"
    required: false
  - name: MAX_EVICTIONS_PER_FLUSH
    inputType: FreeText
    description: "TTL sweep budget: expired keys evicted per checkpoint. The throughput dial - raise this, not the commit interval. Library default 150000."
    defaultValue: "200000"
    required: false
  - name: LEGACY_BACKFILL_CHUNK_SIZE
    inputType: FreeText
    description: Records re-stamped per write-batch during the one-time legacy backfill. Bounds peak transient memory to one chunk. Library default 150000.
    defaultValue: "200000"
    required: false
  - name: COMMIT_INTERVAL
    inputType: FreeText
    description: Seconds between checkpoints. A checkpoint's cost is mostly fixed (producer flush + offset commit), so shrinking this buys no sweep throughput and starves message processing.
    defaultValue: "1.0"
    required: false
  - name: STATE_DIR
    inputType: FreeText
    description: Explicit RocksDB state dir. Leave equal to the mounted volume (/app/statecfb2) for a WARM store; a fresh SUBDIR of the volume (e.g. /app/statecfb2/run3) forces one cold rebuild from the changelog. Declared here so the Portal does not drop it on redeploy.
    defaultValue: /app/statecfb2
    required: false
  - name: QUIXSTREAMS_STATE_TTL_ROLLBACK
    inputType: FreeText
    description: quix-streams operational lever, read by the SDK directly from the environment. "1" = on open, roll back a provisionally adopted v3.24.0 store to legacy (strip stamps, clear __ttl_enabled__) and suppress cold auto-adopt. "0" = normal. Declared here so the Portal does not drop it on redeploy.
    defaultValue: "0"
    required: false
dockerfile: build/dockerfile
runEntryPoint: main.py
defaultFile: main.py
