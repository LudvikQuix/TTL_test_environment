# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Duplicate Key Generator
    application: duplicate-key-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 200
    desiredStatus: Stopped
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to produce duplicate-key messages to
        required: true
        value: raw-events
      - name: KEY_SPACE
        inputType: FreeText
        description: Upper bound for random order IDs (1..KEY_SPACE). Larger = more unique keys = faster state growth downstream.
        value: 40000000
      - name: MESSAGE_COUNT
        inputType: FreeText
        description: Total messages to produce, then exit. 0 = run forever (Service mode).
        value: 0
      - name: SLEEP_SECONDS
        inputType: FreeText
        description: Delay between messages in seconds. Default 0.01 = ~100 msg/s.
        value: 0.00001
      - name: SEED
        inputType: FreeText
        description: Optional integer seed for random. Set to make the sequence reproducible.
        value: 42
  - name: Path B [B2 v3.24.0 store -> current]
    application: dedup-cf-b
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    state:
      enabled: true
      size: 5
      path: /app/statecfb2
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        value: raw-events
      - name: output
        inputType: OutputTopic
        value: deduped-events-no-ttl
      - name: STATE_DIR
        inputType: FreeText
        value: /app/statecfb2
      - name: CG_PREFIX
        inputType: FreeText
        value: dedup-cf-b
      - name: CG_VERSION
        inputType: FreeText
        value: v4
      - name: TTL_MODE
        inputType: FreeText
        value: 1
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        value: 3600
      - name: BLOCK_CACHE_SIZE
        inputType: FreeText
        value: 134217728
      - name: BLOCK_CACHE_PROBE_REPEAT_S
        inputType: FreeText
        value: 60
      - name: VALUE_PADDING_BYTES
        inputType: FreeText
        value: 800
      - name: LOGGER
        inputType: FreeText
        value: on
      - name: COMMIT_INTERVAL
        inputType: FreeText
        value: 1.0
      - name: QUIXSTREAMS_STATE_LOG_LEVEL
        inputType: FreeText
        value: INFO
      - name: STATE_SIZE_LOG_INTERVAL
        inputType: FreeText
        value: 60
      - name: LEGACY_RECORDS_TTL_SECONDS
        inputType: FreeText
        value: 3600
      - name: MAX_EVICTIONS_PER_FLUSH
        inputType: FreeText
        value: 200000
      - name: LEGACY_BACKFILL_CHUNK_SIZE
        inputType: FreeText
        value: 200000
      - name: ARM_LABEL
        inputType: FreeText
        value: pathB

# This section describes the Topics of the data pipeline
topics:
  - name: raw-events
    configuration:
      retentionInBytes: 314572800
  - name: deduped-events-no-ttl
  - name: ttl-verify-input
  - name: ttl-verify-feature-out
  - name: ttl-verify-stable-out
  - name: recovery-output
  - name: recovery-input
  - name: blockcache-verdict
    configuration:
      partitions: 1
      replicationFactor: 2
      retentionInMinutes: -1
      retentionInBytes: 52428800
      cleanupPolicy: Delete
