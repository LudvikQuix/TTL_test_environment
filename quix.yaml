# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Recovery Generator
    application: recovery-generator
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 200
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to produce recovery-test messages to. Created by the app with segment.ms=60000 / retention.ms=120000.
        required: true
        value: recovery-input
      - name: RATE_PER_SECOND
        inputType: FreeText
        description: Messages per second (sleep-paced).
        value: 100
      - name: PADDING_BYTES
        inputType: FreeText
        description: Bytes of 'x' padding per message so segments fill at a predictable rate.
        value: 200
      - name: KEY_COUNT
        inputType: FreeText
        description: Key space size; keys are key-{seq % KEY_COUNT}.
        value: 1000
      - name: FLIP_PROBABILITY
        inputType: FreeText
        description: Probability (0.0-1.0) that a key's ON/OFF status flips on a given occurrence of that key; otherwise it holds its previous status.
        value: 0.05
      - name: MESSAGE_COUNT
        inputType: FreeText
        description: Number of messages to emit before flushing and exiting (Job). 0 = run forever (legacy Service behavior).
        value: 10000
  - name: Recovery Filter
    application: recovery-filter
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with recovery-test messages (aggressive retention).
        required: true
        value: recovery-input
      - name: output
        inputType: OutputTopic
        description: Topic with deduplicated ON/OFF status events (only changes or TTL-expired repeats pass through).
        required: true
        value: recovery-output
      - name: AUTO_RECOVER
        inputType: FreeText
        description: Maps to auto_recover_from_source_offset_out_of_range. true = destroy + rebuild state when committed offset < low watermark; false = raise StateRecoveryOffsetOutOfRange.
        value: true
      - name: OFFSET_RESET
        inputType: FreeText
        description: Maps to state_recovery_offset_reset. One of earliest | latest | match.
        value: earliest
      - name: STATE_DIR
        inputType: FreeText
        description: Local directory for RocksDB state.
        value: state
      - name: STATE_SIZE_LOG_INTERVAL
        inputType: FreeText
        description: Seconds between [STATE-SIZE-RECOVERY] log lines.
        value: 10
      - name: LOGGER
        inputType: FreeText
        description: off/info/debug. off disables periodic status logging. info (default) logs periodic [STATE-SIZE-RECOVERY] lines. debug additionally logs per-message key/count detail and sets quixstreams logger to DEBUG.
        value: info
      - name: TTL_MODE
        inputType: FreeText
        description: on/off. on = per-key state entries expire after STATE_TTL_SECONDS. off = state persists indefinitely (default, unchanged behavior).
        value: on
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        description: Seconds before a per-key state entry expires (used only when TTL_MODE=on).
        value: 15
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group id for this deployment. Change this to reset consumption/offsets independently across deployment updates.
        value: recovery-filter-v1.0
      - name: BILLING_ENABLED
        inputType: FreeText
        description: When true, emit fire-and-forget billing events to the billing-sink. Never blocks or crashes filtering.
        value: true
      - name: BILLING_URL
        inputType: FreeText
        description: Base URL of the billing-sink service (in-cluster serviceName).
        value: http://billing-sink
      - name: BILLING_TOKEN
        inputType: FreeText
        description: Bearer token for billing POSTs. Empty falls back to the injected Quix__Sdk__Token.
        value: ''
      - name: BILLING_ENVIRONMENT_ID
        inputType: FreeText
        description: X-Environment-Id header on billing POSTs. Empty falls back to injected Quix__Workspace__Id.
        value: ''
      - name: BILLING_DEPLOYMENT_ID
        inputType: FreeText
        description: X-Deployment-Id header on billing POSTs. Empty falls back to injected Quix__Deployment__Id.
        value: ''
      - name: BILLING_MESSAGES_PER_EVENT
        inputType: FreeText
        description: Emit a messages-processed-<N> billing event every N processed messages.
        value: 1000
      - name: BILLING_TIMEOUT_SECONDS
        inputType: FreeText
        description: HTTP timeout (seconds) for each billing POST.
        value: 2.0
      - name: BILLING_QUEUE_MAXSIZE
        inputType: FreeText
        description: Max queued billing POSTs before new events are dropped (counter incremented).
        value: 1000
  - name: Billing Sink
    application: billing-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: billingsink-6de456
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    network:
      serviceName: billing-sink
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: BILLING_TOPIC
        inputType: FreeText
        description: Name of the internal self-loop topic (HTTP handler produces billing events + flush ticks, the single stateful SDF consumes). Not an ingress - external callers use POST /billing only.
        required: true
        value: billing-events
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of buffered events that triggers a Lakehouse flush.
        required: true
        value: 500
      - name: HTTP_PORT
        inputType: FreeText
        description: Port uvicorn binds for the POST /billing and GET /healthz endpoints.
        value: 80
      - name: FLUSH_INTERVAL_SECONDS
        inputType: FreeText
        description: Max seconds a non-empty buffer waits before a time-based flush; also the flush-tick cadence.
        value: 30
      - name: DEDUP_TTL_SECONDS
        inputType: FreeText
        description: TTL of the per-event _sunk idempotency marker; must exceed the consumer commit window.
        value: 600
      - name: SCHEMA_VERSION
        inputType: FreeText
        description: Constant written into each row's schema_version column.
        value: 1
      - name: LAKE_TABLE
        inputType: FreeText
        description: Lakehouse table name for billing rows.
        value: billing_events
      - name: STATE_KEY
        inputType: FreeText
        description: Constant message key so all events share one State store. Empty falls back to Quix__Deployment__Id, else "billing-sink".
        value: ''
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group id; changelog topic name embeds it.
        value: billing-sink-v1
      - name: STATE_DIR
        inputType: FreeText
        description: Local directory for RocksDB state.
        value: state
      - name: LOGGER
        inputType: FreeText
        description: off/info/debug. off silences [BILLING-SINK] lines; debug also sets quixstreams logger to DEBUG.
        value: info
      - name: FLUSH_RETRY_BASE_MS
        inputType: FreeText
        description: Base delay for the flush retry backoff after a failed Lakehouse write (beyond spec 7.3; parameterizes the section 5.4 backoff).
        value: 1000
      - name: FLUSH_RETRY_CAP_MS
        inputType: FreeText
        description: Cap for the flush retry backoff delay (beyond spec 7.3).
        value: 60000
      - name: AUTH_ENABLED
        inputType: FreeText
        description: true = require Authorization Bearer token on POST /billing. false only for broker-less local dev (spec Amendment A1).
        value: false
      - name: AUTH_CACHE_SECONDS
        inputType: FreeText
        description: quixportal Auth validation cache validity, passed as Auth(cache_validity=...).
        value: 300
      - name: AUTH_REQUIRED_PERMISSION
        inputType: FreeText
        description: Workspace permission required to bill (Create/Read/Update/Delete/Write/All).
        value: Write
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: raw-events
  - name: deduped-events
  - name: deduped-events-no-ttl
  - name: deduped-events-stable
  - name: ttl-verify-input
  - name: ttl-verify-feature-out
  - name: ttl-verify-stable-out
  - name: recovery-output
  - name: recovery-input
  - name: billing-events
