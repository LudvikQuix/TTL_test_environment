# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Duplicate Key Generator
    application: duplicate-key-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 200
    desiredStatus: Running
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to produce duplicate-key messages to
        required: true
        value: raw-events
      - name: KEY_SPACE
        inputType: FreeText
        description: Upper bound for random order IDs (1..KEY_SPACE). Larger = more unique keys = faster state growth downstream.
        value: 150000
      - name: MESSAGE_COUNT
        inputType: FreeText
        description: Total messages to produce, then exit. 0 = run forever (Service mode).
        value: 0
      - name: SLEEP_SECONDS
        inputType: FreeText
        description: Delay between messages in seconds. Default 0.01 = ~100 msg/s.
        value: 0.0001
      - name: SEED
        inputType: FreeText
        description: Optional integer seed for random. Set to make the sequence reproducible.
        value: 42
  - name: Dedup Filter
    application: dedup-filter
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with raw events (may contain duplicate keys)
        required: true
        value: raw-events
      - name: output
        inputType: OutputTopic
        description: Topic with deduplicated events
        required: true
        value: deduped-events
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        description: TTL for seen-key state in seconds
        value: 3
      - name: VALUE_PADDING_BYTES
        inputType: FreeText
        description: Pad each stored value with this many bytes so TTL timestamp overhead is small relative to entry size.
        value: 1000
      - name: QUIXSTREAMS_STATE_LOG_LEVEL
        inputType: FreeText
        description: State-scoped log level; DEBUG surfaces the backfill STARTED/progress/FINISHED + per-flush logs.
        value: DEBUG
  - name: Dedup Filter (No TTL)
    application: dedup-filter-no-ttl
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with raw events (shared input across all dedup filters)
        required: true
        value: raw-events
      - name: output
        inputType: OutputTopic
        description: Topic with deduplicated events (no-TTL pipeline)
        required: true
        value: deduped-events-no-ttl
      - name: VALUE_PADDING_BYTES
        inputType: FreeText
        description: Pad each stored value with this many bytes (matches the TTL filter for apples-to-apples comparison).
        value: 1000
  - name: TTL Verify Generator
    application: ttl-verify-generator
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 200
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic both ttl-verify dedupers read from
        required: true
        value: ttl-verify-input
      - name: TTL_WAIT_SECONDS
        inputType: FreeText
        description: Pause between same-order events that must EXCEED the feature deduper's STATE_TTL_SECONDS so the cached entry expires.
        value: 7
  - name: TTL Verify (Feature)
    application: ttl-verify-feature
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        value: ttl-verify-input
      - name: output
        inputType: OutputTopic
        value: ttl-verify-feature-out
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        description: Must be SHORTER than generator's WAIT_SECONDS so batch 2 sees expired state
        value: 5
  - name: TTL Verify (Stable)
    application: ttl-verify-stable
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        value: ttl-verify-input
      - name: output
        inputType: OutputTopic
        value: ttl-verify-stable-out
  - name: Recovery Generator
    application: recovery-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 200
    desiredStatus: Stopped
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to produce recovery-test messages to. Created by the app with segment.ms=60000 / retention.ms=120000.
        required: true
        value: recovery-input
      - name: RATE_PER_SECOND
        inputType: FreeText
        description: Messages per second (sleep-paced).
        value: 100
      - name: PADDING_BYTES
        inputType: FreeText
        description: Bytes of 'x' padding per message so segments fill at a predictable rate.
        value: 200
      - name: KEY_COUNT
        inputType: FreeText
        description: Key space size; keys are key-{seq % KEY_COUNT}.
        value: 1000
      - name: FLIP_PROBABILITY
        inputType: FreeText
        description: Probability (0.0-1.0) that a key's ON/OFF status flips on a given occurrence of that key; otherwise it holds its previous status.
        value: 0.05
  - name: Recovery Filter
    application: recovery-filter
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with recovery-test messages (aggressive retention).
        required: true
        value: recovery-input
      - name: output
        inputType: OutputTopic
        description: Topic with deduplicated ON/OFF status events (only changes or TTL-expired repeats pass through).
        required: true
        value: recovery-output
      - name: AUTO_RECOVER
        inputType: FreeText
        description: Maps to auto_recover_from_source_offset_out_of_range. true = destroy + rebuild state when committed offset < low watermark; false = raise StateRecoveryOffsetOutOfRange.
        value: true
      - name: OFFSET_RESET
        inputType: FreeText
        description: Maps to state_recovery_offset_reset. One of earliest | latest | match.
        value: earliest
      - name: STATE_DIR
        inputType: FreeText
        description: Local directory for RocksDB state.
        value: state
      - name: STATE_SIZE_LOG_INTERVAL
        inputType: FreeText
        description: Seconds between [STATE-SIZE-RECOVERY] log lines.
        value: 10
      - name: LOGGER
        inputType: FreeText
        description: off/info/debug. off disables periodic status logging. info (default) logs periodic [STATE-SIZE-RECOVERY] lines. debug additionally logs per-message key/count detail and sets quixstreams logger to DEBUG.
        value: info
      - name: TTL_MODE
        inputType: FreeText
        description: on/off. on = per-key state entries expire after STATE_TTL_SECONDS. off = state persists indefinitely (default, unchanged behavior).
        value: on
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        description: Seconds before a per-key state entry expires (used only when TTL_MODE=on).
        value: 15
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group id for this deployment. Change this to reset consumption/offsets independently across deployment updates.
        value: recovery-filter-v1.0
  - name: Dedup Filter BackFill
    group: v1.1
    application: dedup-filter-stable
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    state:
      enabled: true
      size: 2
      path: /app/state
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with raw events (shared input across all dedup filters)
        required: true
        value: raw-events
      - name: output
        inputType: OutputTopic
        description: Topic with deduplicated events
        required: true
        value: deduped-events-stable
      - name: VALUE_PADDING_BYTES
        inputType: FreeText
        description: Pad each stored value with this many bytes (apples-to-apples across filters).
        value: 2000
      - name: CG_PREFIX
        inputType: FreeText
        description: Consumer-group prefix (state namespace). Per service to isolate stores.
        value: dedup-filter-stable
      - name: CG_VERSION
        inputType: FreeText
        description: Consumer-group suffix (e.g. v1). Bump for a fresh clean store, no code change.
        value: v10.4
      - name: TTL_MODE
        inputType: FreeText
        description: 0 = legacy seeder (no ttl=, byte-identical to 3.23.6). 1 = TTL build (ttl= + legacy_records_ttl -> flip+backfill).
        value: 1
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        description: Per-write ttl= for new dedup entries, seconds (used when TTL_MODE=1).
        value: 3600
      - name: LEGACY_RECORDS_TTL_SECONDS
        inputType: FreeText
        description: One-time backfill TTL (seconds) for pre-existing legacy records on upgrade (used when TTL_MODE=1).
        value: 3600
      - name: LOGGER
        inputType: FreeText
        description: on/off. off disables the periodic status logger (skips its per-interval rocksdb key scan). Set off in production.
        value: on
      - name: TTL_CHANGELOG_TOMBSTONES
        inputType: FreeText
        description: 1 = TTL sweep also deletes expired keys from the changelog topic (compaction shrinks it). 0 = local-only sweep, changelog keeps every record.
        value: 1
      - name: QUIXSTREAMS_STATE_LOG_LEVEL
        inputType: FreeText
        description: Log level for the quixstreams state layer (DEBUG shows per-chunk backfill/migration progress).
        value: DEBUG
      - name: STATE_SIZE_LOG_INTERVAL
        inputType: FreeText
        description: Seconds between periodic [STATE-SIZE-STABLE] status lines (when LOGGER=on).
        value: 10
      - name: ROCKSDB_WRITE_BUFFER_SIZE
        inputType: FreeText
        description: RocksDB write buffer size in bytes (memtable). Test-env tuning knob.
        value: 1048576
      - name: ROCKSDB_TARGET_FILE_SIZE_BASE
        inputType: FreeText
        description: RocksDB target SST file size in bytes. Test-env tuning knob.
        value: 2097152
      - name: ROCKSDB_MAX_WRITE_BUFFER_NUMBER
        inputType: FreeText
        description: Max RocksDB write buffers (memtables) per store partition.
        value: 2

# This section describes the Topics of the data pipeline
topics:
  - name: raw-events
  - name: deduped-events
  - name: deduped-events-no-ttl
  - name: deduped-events-stable
  - name: ttl-verify-input
  - name: ttl-verify-feature-out
  - name: ttl-verify-stable-out
  - name: recovery-output
  - name: recovery-input
