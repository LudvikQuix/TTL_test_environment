# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Duplicate Key Generator
    application: duplicate-key-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 200
    desiredStatus: Stopped
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to produce duplicate-key messages to
        required: true
        value: raw-events
      - name: KEY_SPACE
        inputType: FreeText
        description: Upper bound for random order IDs (1..KEY_SPACE). Larger = more unique keys = faster state growth downstream.
        value: 40000000
      - name: MESSAGE_COUNT
        inputType: FreeText
        description: Total messages to produce, then exit. 0 = run forever (Service mode).
        value: 0
      - name: SLEEP_SECONDS
        inputType: FreeText
        description: Delay between messages in seconds. Default 0.01 = ~100 msg/s.
        value: 0.00001
      - name: SEED
        inputType: FreeText
        description: Optional integer seed for random. Set to make the sequence reproducible.
        value: 42
  - name: Path B [B2 v3.24.0 store -> current]
    application: dedup-cf-b
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 2000
    state:
      enabled: true
      size: 5
      path: /app/statecfb2
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        value: raw-events
      - name: output
        inputType: OutputTopic
        value: deduped-events-no-ttl
      - name: STATE_DIR
        inputType: FreeText
        value: /app/statecfb2
      - name: CG_PREFIX
        inputType: FreeText
        value: dedup-cf-b
      - name: CG_VERSION
        inputType: FreeText
        value: v5
      - name: TTL_MODE
        inputType: FreeText
        value: 1
      - name: STATE_TTL_SECONDS
        inputType: FreeText
        value: 600
      - name: BLOCK_CACHE_SIZE
        inputType: FreeText
        value: 134217728
      - name: BLOCK_CACHE_PROBE_REPEAT_S
        inputType: FreeText
        value: 60
      - name: VALUE_PADDING_BYTES
        inputType: FreeText
        value: 800
      - name: LOGGER
        inputType: FreeText
        value: on
      - name: COMMIT_INTERVAL
        inputType: FreeText
        value: 1.0
      - name: QUIXSTREAMS_STATE_LOG_LEVEL
        inputType: FreeText
        value: INFO
      - name: STATE_SIZE_LOG_INTERVAL
        inputType: FreeText
        value: 60
      - name: LEGACY_RECORDS_TTL_SECONDS
        inputType: FreeText
        value: 3600
      - name: MAX_EVICTIONS_PER_FLUSH
        inputType: FreeText
        value: 200000
      - name: LEGACY_BACKFILL_CHUNK_SIZE
        inputType: FreeText
        value: 200000
      - name: ARM_LABEL
        inputType: FreeText
        value: pathB
  - name: Lake Sink
    application: lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    desiredStatus: Stopped
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: deduped-events-no-ttl
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration. Combined with TABLE_VERSION into the effective table name (e.g. ttl_events_v1).
        value: ttl_events
      - name: TABLE_VERSION
        inputType: FreeText
        description: Suffix appended to TABLE_NAME. BUMP THIS whenever HIVE_COLUMNS, TIMESTAMP_COLUMN or SORT_COLUMN change - the sink validates the partition set against the catalog spec and the on-disk Hive paths at startup and raises on a mismatch, and it writes table properties only when it CREATES the table. A layout or property change is a migration, not a tweak. Blank the value for no suffix (the bare TABLE_NAME); delete the variable to get the v1 default back.
        value: v1
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: "Comma-separated list of columns for Hive partitioning (e.g. region,datacenter,hostname OR year,month,day extracted from TIMESTAMP_COLUMN). Leave empty for no Hive partitioning - every column listed here must exist in the incoming message payload, otherwise writes will fail. Prefix an entry with ~ to make it VIRTUAL (no key=value/ folder, does not split files, column kept in the parquet, indexed in .vidx sidecars) - use it for high-cardinality ids. year/month/day/hour are derived from TIMESTAMP_COLUMN and are physical-only. Changing this requires a TABLE_VERSION bump."
        value: "year,month,day,hour,status,~order_id"
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from (only used when HIVE_COLUMNS includes one of those time components). Also the fallback ordering column when SORT_COLUMN is unset. The generator emits epoch milliseconds in "timestamp".
        value: timestamp
      - name: SORT_COLUMN
        inputType: FreeText
        description: Column recorded as properties.sort_column at table creation, which lakehouse compaction orders files by. Blank the value for unset, which falls back to TIMESTAMP_COLUMN; delete the variable to get the seq default back. Setting it equal to TIMESTAMP_COLUMN is indistinguishable from unset. "seq" is the process-local counter this service stamps on every record.
        value: seq
      - name: STATS_COLUMNS
        inputType: FreeText
        description: Comma-separated columns to compute per-file min/max statistics (zone maps) for, sent to the catalog as column_stats. Empty = every numeric and timestamp column of each written file, which here is timestamp plus seq. Restrict only on very wide tables.
        value: ""
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: "true/false. Automatically register table in REST Catalog on first write. false leaves partition_spec, virtual_partitions, sort_column and column_stats unrecorded."
        value: "true"
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to storage. Counts INPUT messages, not output rows.
        value: 1000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds. Also the flush cadence, so together with BATCH_SIZE it sets the parquet file size.
        value: 30
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name. Bump it to re-sink the topic from AUTO_OFFSET_RESET (pair with a TABLE_VERSION bump to avoid duplicate rows in an existing table).
        value: s3_direct_sink_v1.0
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: "Where to start consuming if no offset exists: earliest or latest. earliest sinks the existing backlog on a fresh consumer group."
        value: earliest
      - name: LOGLEVEL
        inputType: FreeText
        description: "Application logging level: DEBUG, INFO, WARNING, ERROR or CRITICAL. DEBUG logs each uploaded data file and sidecar."
        value: INFO
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        description: How many files can be written in parallel to storage at once (based on partitioning + batch size)
        value: 10
    # Mandatory, not optional: on dev the blob bind is the injection vehicle for
    # the WHOLE Quix__Lakehouse__* bundle (catalog URL + auth token), not just
    # for Quix__BlobStorage__Connection__Json. Remove it and the sink boots with
    # no catalog and records no partition_spec/properties/column_stats.
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: raw-events
    configuration:
      retentionInBytes: 314572800
  - name: deduped-events-no-ttl
  - name: blockcache-verdict
    configuration:
      partitions: 1
      replicationFactor: 2
      retentionInMinutes: -1
      retentionInBytes: 52428800
      cleanupPolicy: Delete
